name: Test mine-data

on:
  push:
    branches: [main]
    paths:
      - 'mine-data/**'
      - '.github/workflows/test-mine-data.yml'
  pull_request:
    paths:
      - 'mine-data/**'
      - '.github/workflows/test-mine-data.yml'

permissions:
  contents: read

jobs:
  test-runner:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test runner against local mock API
        run: node --test mine-data/scripts/mine.test.mjs
